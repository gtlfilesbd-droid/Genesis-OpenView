{% extends "camera/base.html" %}
{% block title %}Live{% endblock %}
{% block content %}
<h1>Live</h1>
<section id="object-classes" class="panel objects">
  <div class="objects-row">
    <span class="muted">On</span>
    <div id="enabled-objects" class="chips"></div>
    <button type="button" id="object-picker" class="ghost">Choose</button>
  </div>
  <div id="object-menu" class="object-menu" hidden>
    <input id="object-search" type="search" placeholder="Search objects" autocomplete="off">
    <div id="object-list"></div>
  </div>
</section>
<div class="layout">
  <div class="video-wrap">
    <img id="video" src="{% url 'stream' %}" alt="Live camera">
    <div id="banner" class="banner" hidden></div>
  </div>
  <aside class="panel">
    <form method="post" action="{% url 'control' %}">
      {% csrf_token %}
      <label>Camera number
        <input type="number" name="camera" min="1" value="{{ camera }}" required>
      </label>
      <label><input type="radio" name="stream" value="sub" {% if stream == "sub" %}checked{% endif %}> Sub stream</label>
      <label><input type="radio" name="stream" value="main" {% if stream == "main" %}checked{% endif %}> Main stream</label>
      <div class="row">
        <button name="action" value="start">Start</button>
        <button class="ghost" name="action" value="stop">Stop</button>
      </div>
    </form>
    <p id="meta" class="muted">Camera stopped</p>
    <p id="error" class="error"></p>
    <table>
      <thead><tr><th>Object</th><th>Name</th><th>Confidence</th><th>Zone</th></tr></thead>
      <tbody id="detections"></tbody>
    </table>
  </aside>
</div>
<script>
const meta = document.getElementById("meta");
const error = document.getElementById("error");
const detections = document.getElementById("detections");
const banner = document.getElementById("banner");
const enabledObjects = document.getElementById("enabled-objects");
const objectMenu = document.getElementById("object-menu");
const objectSearch = document.getElementById("object-search");
const objectList = document.getElementById("object-list");
const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
let lastAlarm = 0;
let audioReady = false;
let latestGroups = [];

function beep() {
  const context = new AudioContext();
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.frequency.value = 880;
  oscillator.connect(gain);
  gain.connect(context.destination);
  gain.gain.setValueAtTime(0.08, context.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.35);
  oscillator.start();
  oscillator.stop(context.currentTime + 0.35);
}

async function tick() {
  const response = await fetch("{% url 'status' %}");
  const data = await response.json();
  const state = data.running ? "Live" : (data.starting ? "Reconnecting" : "Stopped");
  if (data.running) {
    const video = document.getElementById("video");
    if (video.dataset.live !== "1") {
      video.dataset.live = "1";
      video.src = "{% url 'stream' %}?t=" + Date.now();
    }
  } else if (!data.starting) {
    document.getElementById("video").dataset.live = "0";
  }
  meta.textContent = state + " · camera " + data.camera + " · channel " + (data.channel || "—") + " · " + data.device;
  if (typeof data.people_count === "number") meta.textContent += " · people " + data.people_count;
  if (typeof data.crowd_count === "number") meta.textContent += " · crowd " + data.crowd_count;
  error.textContent = data.error || "";
  latestGroups = data.classes || [];
  renderEnabled();
  if (!objectMenu.hidden) renderMenu();
  detections.replaceChildren();
  for (const item of data.detections || []) {
    const row = document.createElement("tr");
    const objectCell = document.createElement("td");
    const nameCell = document.createElement("td");
    const confidenceCell = document.createElement("td");
    const zoneCell = document.createElement("td");
    objectCell.textContent = item.label;
    nameCell.textContent = item.name ? (item.list ? item.name + " · " + item.list : item.name) : "—";
    confidenceCell.textContent = Math.round(item.confidence * 100) + "%";
    zoneCell.textContent = item.class_id === 0 && item.inside ? item.dwell + "s" : "—";
    row.append(objectCell, nameCell, confidenceCell, zoneCell);
    detections.append(row);
  }
  if (data.alarm && data.alarm.active) {
    banner.hidden = false;
    let alarmText = data.alarm.label || "Alarm";
    if (data.alarm.name && data.alarm.name !== alarmText) alarmText += " · " + data.alarm.name;
    banner.textContent = alarmText;
    if (data.alarm.id !== lastAlarm) {
      lastAlarm = data.alarm.id;
      if (audioReady) beep();
    }
  } else {
    banner.hidden = true;
  }
}

function eachClass() {
  return latestGroups.flatMap((group) => group.items);
}

function renderEnabled() {
  enabledObjects.replaceChildren();
  for (const item of eachClass()) {
    if (!item.enabled) continue;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "chip on";
    button.textContent = item.label;
    button.addEventListener("click", () => toggleClass(item.id));
    enabledObjects.append(button);
  }
}

function renderMenu() {
  const query = objectSearch.value.trim().toLowerCase();
  objectList.replaceChildren();
  for (const item of eachClass()) {
    if (query && !item.label.toLowerCase().includes(query) && !item.name.toLowerCase().includes(query)) continue;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "menu-item" + (item.enabled ? " on" : "");
    button.textContent = item.label;
    button.addEventListener("click", () => toggleClass(item.id));
    objectList.append(button);
  }
}

async function toggleClass(classId) {
  const item = eachClass().find((entry) => entry.id === classId);
  if (item) item.enabled = !item.enabled;
  renderEnabled();
  if (!objectMenu.hidden) renderMenu();
  const body = new FormData();
  body.append("class_id", String(classId));
  body.append("csrfmiddlewaretoken", csrf);
  const response = await fetch("{% url 'objects' %}", { method: "POST", body });
  if (!response.ok && item) {
    item.enabled = !item.enabled;
    renderEnabled();
    if (!objectMenu.hidden) renderMenu();
  }
}

document.getElementById("object-picker").addEventListener("click", () => {
  objectMenu.hidden = !objectMenu.hidden;
  if (!objectMenu.hidden) {
    renderMenu();
    objectSearch.focus();
  }
});
objectSearch.addEventListener("input", renderMenu);
document.addEventListener("click", (event) => {
  if (!document.getElementById("object-classes").contains(event.target)) objectMenu.hidden = true;
});

document.addEventListener("pointerdown", () => { audioReady = true; }, { once: true });
tick();
setInterval(tick, 1000);
</script>
{% endblock %}
