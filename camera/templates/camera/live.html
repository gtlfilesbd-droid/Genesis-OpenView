{% extends "camera/base.html" %}
{% block title %}Live{% endblock %}
{% block content %}
<h1>Live</h1>
<section id="object-classes" class="panel objects"></section>
<div class="layout">
  <div class="video-wrap">
    <img id="video" src="{% url 'stream' %}" alt="Live camera">
    <div id="banner" class="banner" hidden></div>
  </div>
  <aside class="panel">
    <form method="post" action="{% url 'control' %}">
      {% csrf_token %}
      <label>Camera number
        <input type="number" name="camera" min="1" value="{{ camera }}" required>
      </label>
      <label><input type="radio" name="stream" value="sub" {% if stream == "sub" %}checked{% endif %}> Sub stream</label>
      <label><input type="radio" name="stream" value="main" {% if stream == "main" %}checked{% endif %}> Main stream</label>
      <div class="row">
        <button name="action" value="start">Start</button>
        <button class="ghost" name="action" value="stop">Stop</button>
      </div>
    </form>
    <p id="meta" class="muted">Camera stopped</p>
    <p id="error" class="error"></p>
    <table>
      <thead><tr><th>Object</th><th>Name</th><th>Confidence</th><th>Zone</th></tr></thead>
      <tbody id="detections"></tbody>
    </table>
  </aside>
</div>
<script>
const meta = document.getElementById("meta");
const error = document.getElementById("error");
const detections = document.getElementById("detections");
const banner = document.getElementById("banner");
const objectClasses = document.getElementById("object-classes");
const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
let lastAlarm = 0;
let audioReady = false;
let chipsReady = false;

function beep() {
  const context = new AudioContext();
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.frequency.value = 880;
  oscillator.connect(gain);
  gain.connect(context.destination);
  gain.gain.setValueAtTime(0.08, context.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.35);
  oscillator.start();
  oscillator.stop(context.currentTime + 0.35);
}

async function tick() {
  const response = await fetch("{% url 'status' %}");
  const data = await response.json();
  const state = data.running ? "Live" : (data.starting ? "Reconnecting" : "Stopped");
  if (data.running) {
    const video = document.getElementById("video");
    if (video.dataset.live !== "1") {
      video.dataset.live = "1";
      video.src = "{% url 'stream' %}?t=" + Date.now();
    }
  } else if (!data.starting) {
    document.getElementById("video").dataset.live = "0";
  }
  meta.textContent = state + " · camera " + data.camera + " · channel " + (data.channel || "—") + " · " + data.device;
  error.textContent = data.error || "";
  renderClasses(data.classes || []);
  detections.replaceChildren();
  for (const item of data.detections || []) {
    const row = document.createElement("tr");
    const objectCell = document.createElement("td");
    const nameCell = document.createElement("td");
    const confidenceCell = document.createElement("td");
    const zoneCell = document.createElement("td");
    objectCell.textContent = item.label;
    nameCell.textContent = item.name || "—";
    confidenceCell.textContent = Math.round(item.confidence * 100) + "%";
    zoneCell.textContent = item.class_id === 0 && item.inside ? item.dwell + "s" : "—";
    row.append(objectCell, nameCell, confidenceCell, zoneCell);
    detections.append(row);
  }
  if (data.alarm && data.alarm.active) {
    banner.hidden = false;
    banner.textContent = "Alarm · person " + data.alarm.track_id + " · " + data.alarm.name;
    if (data.alarm.id !== lastAlarm) {
      lastAlarm = data.alarm.id;
      if (audioReady) beep();
    }
  } else {
    banner.hidden = true;
  }
}

function renderClasses(groups) {
  if (!chipsReady) {
    objectClasses.replaceChildren();
    for (const group of groups) {
      const section = document.createElement("div");
      section.className = "group";
      const heading = document.createElement("h2");
      heading.textContent = group.name;
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const item of group.items) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.id = "class-" + item.id;
        button.textContent = item.label;
        button.addEventListener("click", () => toggleClass(item.id, button));
        chips.append(button);
      }
      section.append(heading, chips);
      objectClasses.append(section);
    }
    chipsReady = true;
  }
  for (const group of groups) {
    for (const item of group.items) {
      const button = document.getElementById("class-" + item.id);
      if (button) button.classList.toggle("on", item.enabled);
    }
  }
}

async function toggleClass(classId, button) {
  button.classList.toggle("on");
  const body = new FormData();
  body.append("class_id", String(classId));
  body.append("csrfmiddlewaretoken", csrf);
  const response = await fetch("{% url 'objects' %}", { method: "POST", body });
  if (!response.ok) button.classList.toggle("on");
}

document.addEventListener("pointerdown", () => { audioReady = true; }, { once: true });
tick();
setInterval(tick, 1000);
</script>
{% endblock %}
