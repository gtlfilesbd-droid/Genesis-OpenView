<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Camera{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #1a1e24;
      --text: #e8edf2;
      --muted: #9aa6b2;
      --line: #2c333d;
      --accent: #d7a441;
      --alarm: #d64545;
      --ok: #3e9d6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
    }
    nav { display: flex; gap: 14px; }
    nav a { color: var(--text); text-decoration: none; }
    nav a.active, nav a:hover { color: var(--accent); }
    main { padding: 20px; max-width: 1180px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 14px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
    }
    label { display: block; margin: 10px 0; color: var(--muted); }
    input, button {
      font: inherit;
      color: var(--text);
      background: #12161b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
    }
    button, .button {
      background: var(--accent);
      color: #1a1408;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; }
    .video-wrap { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
    .video-wrap img, .stage img { width: 100%; display: block; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
    .muted { color: var(--muted); }
    .error { color: #ffb4b4; }
    .ok { color: #b7ebc9; }
    .banner {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      background: var(--alarm);
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 650;
    }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .cards img, .shot { width: 100%; border-radius: 8px; background: #000; }
    .stage { position: relative; display: inline-block; max-width: 100%; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; background: #243028; }
    .messages .error { background: #3a2020; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <strong>Camera console</strong>
    <nav>
      <a href="{% url 'live' %}" {% if request.resolver_match.url_name == 'live' %}class="active"{% endif %}>Live</a>
      <a href="{% url 'zone' %}" {% if request.resolver_match.url_name == 'zone' %}class="active"{% endif %}>Zone</a>
      <a href="{% url 'alarms' %}" {% if request.resolver_match.url_name == 'alarms' %}class="active"{% endif %}>Alarms</a>
      <a href="{% url 'people' %}" {% if request.resolver_match.url_name == 'people' %}class="active"{% endif %}>People</a>
      <a href="{% url 'search' %}" {% if request.resolver_match.url_name == 'search' %}class="active"{% endif %}>Search</a>
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
